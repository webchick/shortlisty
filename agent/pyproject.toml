[project]
name = "job-agent"
version = "0.1.0"
description = "Personal job-search agent, built three ways"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "supabase>=2.8.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "resend>=2.4.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
v2 = [
    "playwright>=1.48.0",
    "crawl4ai>=0.4.0",
    "feedparser>=6.0.0",
]
v3 = [
    "temporalio>=1.8.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "ipython>=8.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
